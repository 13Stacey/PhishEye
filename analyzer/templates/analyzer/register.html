<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - PhishEye</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1c1b3b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 350px;
        }
        .card h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #00e6c3;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: none;
            background-color: #2e2e4d;
            color: white;
        }
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #00e6c3;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #00bfa5;
        }
        .link {
            margin-top: 15px;
            text-align: center;
        }
        .link a {
            color: #00e6c3;
            text-decoration: none;
        }
        .alert {
            background-color: #ff4f4f;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>Crear cuenta en PhishEye</h3>

        {% if form.errors %}
            <div class="alert">
                {% for field in form %}
                    {% for error in field.errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                {% endfor %}
                {% for error in form.non_field_errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label for="username">Nombre de usuario</label>
            <input type="text" name="username" value="{{ form.username.value }}" required>

            <label for="password1">Contraseña</label>
            <input type="password" name="password1" required>

            <label for="password2">Repetir contraseña</label>
            <input type="password" name="password2" required>

            <input type="submit" value="Registrarse">
        </form>

        <div class="link">
            ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
